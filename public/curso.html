<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso Didi Index | Big Players Setup</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #F5F3EE;
    --ink:    #1A1917;
    --ink2:   #6B6860;
    --ink3:   #A8A59E;
    --box:    #E8E5DE;
    --border: #C8C4BB;
    --white:  #FFFFFF;
    --yellow: #F5E642;
    --green:  #16a34a;
    --red:    #dc2626;
    --sans:   'DM Sans', sans-serif;
    --r: 6px;
  }

  html, body { height: 100%; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.65;
  }

  /* ── LOGIN ─────────────────────────────────────── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-box {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  .login-logo {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .04em;
    margin-bottom: 28px;
    color: var(--ink);
  }

  .login-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .login-sub {
    font-size: 13px;
    color: var(--ink2);
    margin-bottom: 28px;
  }

  .login-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
    margin-bottom: 16px;
  }

  .login-field label {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
  }

  .login-field input {
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 10px 14px;
    font-size: 14px;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    outline: none;
    transition: border-color .15s;
  }

  .login-field input:focus { border-color: var(--ink); }

  .login-btn {
    width: 100%;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: var(--r);
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    font-family: var(--sans);
    cursor: pointer;
    transition: opacity .15s;
    margin-top: 4px;
  }

  .login-btn:hover { opacity: .85; }
  .login-btn:disabled { opacity: .5; cursor: not-allowed; }

  .login-error {
    font-size: 12px;
    color: var(--red);
    margin-top: 12px;
    min-height: 18px;
  }

  /* ── CURSO ─────────────────────────────────────── */
  #curso-screen { display: none; }

  .curso-nav {
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .curso-nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .curso-nav-logo { font-size: 13px; font-weight: 700; }

  .curso-nav-right { display: flex; align-items: center; gap: 18px; }

  .curso-progress-mini {
    font-size: 12px;
    color: var(--ink2);
  }

  .curso-nav-logout {
    font-size: 12px;
    color: var(--ink3);
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--sans);
  }

  .curso-nav-logout:hover { color: var(--ink); }

  /* Layout grid */
  .curso-layout {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 32px;
    padding: 32px;
  }

  /* Sidebar */
  .sidebar {
    position: sticky;
    top: 80px;
    align-self: start;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 20px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
  }

  .sidebar-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink2);
    margin-bottom: 16px;
  }

  .modulo {
    margin-bottom: 18px;
  }

  .modulo:last-child { margin-bottom: 0; }

  .modulo-head {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--ink);
  }

  .modulo-num {
    font-size: 10px;
    font-weight: 700;
    background: var(--ink);
    color: var(--bg);
    padding: 2px 6px;
    border-radius: 2px;
  }

  .aulas { list-style: none; }

  .aula-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    font-size: 13px;
    color: var(--ink2);
    border-radius: 4px;
    cursor: pointer;
    transition: background .15s, color .15s;
    margin-bottom: 2px;
  }

  .aula-item:hover { background: var(--bg); color: var(--ink); }

  .aula-item.active {
    background: var(--ink);
    color: var(--bg);
    font-weight: 500;
  }

  .aula-item.active .aula-check { color: var(--bg); border-color: var(--bg); }

  .aula-check {
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--ink3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 10px;
  }

  .aula-item.done .aula-check {
    background: var(--green);
    border-color: var(--green);
    color: var(--white);
  }

  .aula-item.quiz .aula-check {
    border-style: dashed;
  }

  .aula-text { flex: 1; }

  /* Content area */
  .content {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 48px;
    min-height: 60vh;
  }

  .content-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 2px;
    color: var(--ink2);
    margin-bottom: 16px;
  }

  .content h1 {
    font-size: clamp(24px, 3.5vw, 32px);
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 14px;
  }

  .content .lead {
    font-size: 17px;
    color: var(--ink2);
    margin-bottom: 32px;
    line-height: 1.55;
  }

  .content h2 {
    font-size: 20px;
    font-weight: 700;
    margin: 36px 0 14px;
  }

  .content h3 {
    font-size: 16px;
    font-weight: 700;
    margin: 24px 0 10px;
  }

  .content p { margin-bottom: 14px; }

  .content ul, .content ol {
    padding-left: 22px;
    margin-bottom: 14px;
  }

  .content li { margin-bottom: 6px; }

  .content strong { font-weight: 700; color: var(--ink); }

  .content em { font-style: italic; color: var(--ink); }

  .callout {
    background: var(--bg);
    border-left: 3px solid var(--ink);
    padding: 16px 20px;
    border-radius: 4px;
    margin: 20px 0;
    font-size: 15px;
  }

  .callout.warn { border-left-color: var(--red); }
  .callout.tip  { border-left-color: var(--green); }
  .callout.key  { border-left-color: var(--yellow); background: #FBF8E0; }

  .callout-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink2);
    margin-bottom: 6px;
  }

  .indicator-card {
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 18px 20px;
    margin: 14px 0;
    background: var(--bg);
  }

  .indicator-card h4 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .role-pill {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--ink);
    color: var(--bg);
  }

  .role-pill.com  { background: #16a34a; }
  .role-pill.sem  { background: #d97706; }
  .role-pill.pres { background: var(--ink); }
  .role-pill.time { background: #2563eb; }

  .nav-buttons {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }

  .nav-btn {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
    color: var(--ink);
    transition: background .15s;
  }

  .nav-btn:hover:not(:disabled) { background: var(--bg); }
  .nav-btn:disabled { opacity: .3; cursor: not-allowed; }

  .nav-btn.primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .nav-btn.primary:hover:not(:disabled) { opacity: .85; background: var(--ink); }

  /* QUIZ */
  .quiz-intro {
    text-align: center;
    padding: 20px 0 32px;
  }

  .quiz-question {
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 22px;
    margin-bottom: 18px;
    background: var(--bg);
  }

  .quiz-q-num {
    font-size: 11px;
    font-weight: 700;
    color: var(--ink2);
    letter-spacing: .08em;
    margin-bottom: 8px;
  }

  .quiz-q-text {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    line-height: 1.45;
  }

  .quiz-options {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .quiz-opt {
    border: 1px solid var(--border);
    background: var(--white);
    border-radius: var(--r);
    padding: 12px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    font-family: var(--sans);
    text-align: left;
    color: var(--ink);
    width: 100%;
  }

  .quiz-opt:hover:not(.disabled) { border-color: var(--ink); }
  .quiz-opt.selected { border-color: var(--ink); background: var(--bg); }
  .quiz-opt.correct {
    border-color: var(--green);
    background: #f0fdf4;
    color: var(--green);
    font-weight: 600;
  }
  .quiz-opt.wrong {
    border-color: var(--red);
    background: #fef2f2;
    color: var(--red);
  }
  .quiz-opt.disabled { cursor: default; }

  .quiz-explain {
    margin-top: 12px;
    font-size: 13px;
    color: var(--ink2);
    padding: 10px 14px;
    background: var(--white);
    border-radius: 4px;
    border-left: 3px solid var(--ink);
  }

  .quiz-result {
    text-align: center;
    padding: 32px 24px;
    border: 1px solid var(--border);
    border-radius: var(--r);
    background: var(--bg);
    margin-bottom: 24px;
  }

  .quiz-score {
    font-size: 36px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .quiz-result-text {
    font-size: 14px;
    color: var(--ink2);
    margin-bottom: 18px;
  }

  .progress-bar {
    height: 4px;
    background: var(--bg);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 16px;
  }

  .progress-fill {
    height: 100%;
    background: var(--green);
    transition: width .3s ease;
  }

  /* Mobile */
  .sidebar-toggle {
    display: none;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: var(--r);
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
    margin-bottom: 16px;
    width: 100%;
  }

  @media (max-width: 900px) {
    .curso-layout {
      grid-template-columns: 1fr;
      padding: 20px;
      gap: 16px;
    }
    .sidebar {
      position: static;
      max-height: none;
      display: none;
    }
    .sidebar.open { display: block; }
    .sidebar-toggle { display: block; }
    .content { padding: 28px 24px; }
    .curso-nav-inner { padding: 0 20px; }
    .curso-progress-mini { display: none; }
  }
</style>
</head>
<body>

<!-- ── TELA DE LOGIN ─────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">DIDI INDEX ▸ SETUP</div>
    <div class="login-title">Área do Aluno</div>
    <div class="login-sub">Digite a senha de acesso enviada por e-mail.</div>
    <form id="form-login" novalidate>
      <div class="login-field">
        <label for="inp-senha">Senha de acesso</label>
        <input id="inp-senha" type="password" placeholder="••••••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="login-btn" id="btn-login">Entrar</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>
</div>

<!-- ── ÁREA DO CURSO ──────────────────────────────── -->
<div id="curso-screen">
  <nav class="curso-nav">
    <div class="curso-nav-inner">
      <span class="curso-nav-logo">DIDI INDEX ▸ SETUP — Área do Aluno</span>
      <div class="curso-nav-right">
        <span class="curso-progress-mini" id="progress-mini">0% concluído</span>
        <button class="curso-nav-logout" id="btn-logout">Sair</button>
      </div>
    </div>
  </nav>

  <div class="curso-layout">
    <button class="sidebar-toggle" id="sidebar-toggle">Menu de aulas ▾</button>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-title">Curso completo</div>
      <div id="sidebar-modulos"></div>
    </aside>

    <main class="content" id="content"></main>
  </div>
</div>

<script src="/curso.js" defer></script>

</body>
</html>
