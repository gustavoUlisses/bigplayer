<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso Didi Index | Big Players Setup</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  (function(){
    var t = localStorage.getItem('curso_tema') || 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── PALETA ESCURA (padrão) ─────────────────────────────── */
  :root {
    --bg:        #0f1117;
    --surface:   #1a1d27;
    --surface2:  #22263a;
    --ink:       #f0f0f0;
    --ink2:      #9ca3af;
    --ink3:      #6b7280;
    --border:    #2d3148;
    --accent:    #f0f0f0;
    --yellow:    #f5e642;
    --green:     #16a34a;
    --green-bg:  #052e16;
    --red:       #dc2626;
    --red-bg:    #1f0a0a;
    --key-bg:    #1a1a00;
    --sans:      'DM Sans', sans-serif;
    --r:         8px;
    --transition: 200ms ease;
  }

  /* ── PALETA CLARA ───────────────────────────────────────── */
  [data-theme="light"] {
    --bg:        #f5f3ee;
    --surface:   #ffffff;
    --surface2:  #e8e5de;
    --ink:       #1a1917;
    --ink2:      #6b6860;
    --ink3:      #a8a59e;
    --border:    #c8c4bb;
    --accent:    #1a1917;
    --green-bg:  #f0fdf4;
    --red-bg:    #fef2f2;
    --key-bg:    #fbf8e0;
  }

  html, body { height: 100%; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.65;
    transition: background var(--transition), color var(--transition);
  }

  /* ── LOGIN ──────────────────────────────────────────────── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  .login-logo {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
    margin-bottom: 28px;
    color: var(--ink);
  }

  .login-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }

  .login-sub { font-size: 13px; color: var(--ink2); margin-bottom: 28px; }

  .login-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
    margin-bottom: 16px;
  }

  .login-field label { font-size: 12px; font-weight: 600; }

  .login-field input {
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 10px 14px;
    font-size: 14px;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    outline: none;
    transition: border-color .15s;
  }

  .login-field input:focus { border-color: var(--ink2); }

  .login-btn {
    width: 100%;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: var(--r);
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    font-family: var(--sans);
    cursor: pointer;
    transition: opacity .15s;
    margin-top: 4px;
  }

  .login-btn:hover { opacity: .85; }
  .login-btn:disabled { opacity: .5; cursor: not-allowed; }

  .login-error { font-size: 12px; color: var(--red); margin-top: 12px; min-height: 18px; }

  /* ── NAVBAR ─────────────────────────────────────────────── */
  #curso-screen { display: none; }

  .curso-nav {
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 100;
    transition: background var(--transition), border-color var(--transition);
  }

  .curso-nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .curso-nav-logo { font-size: 13px; font-weight: 700; letter-spacing: .04em; }

  .curso-nav-right { display: flex; align-items: center; gap: 16px; }

  .curso-progress-mini { font-size: 12px; color: var(--ink2); }

  /* Botão de tema */
  .btn-theme {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--transition), border-color var(--transition), color var(--transition);
    flex-shrink: 0;
    padding: 0;
  }

  .btn-theme:hover { border-color: var(--ink2); color: var(--ink); }

  .btn-theme svg { width: 16px; height: 16px; display: block; }

  /* Mostra ícone correto por tema */
  .icon-sun  { display: none; }
  .icon-moon { display: block; }
  [data-theme="dark"] .icon-sun  { display: block; }
  [data-theme="dark"] .icon-moon { display: none; }

  .curso-nav-logout {
    font-size: 12px;
    color: var(--ink3);
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--sans);
    transition: color .15s;
  }

  .curso-nav-logout:hover { color: var(--ink); }

  /* ── LAYOUT ─────────────────────────────────────────────── */
  .curso-layout {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 28px;
    padding: 28px 32px;
  }

  /* ── SIDEBAR ────────────────────────────────────────────── */
  .sidebar {
    position: sticky;
    top: 72px;
    align-self: start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 20px;
    max-height: calc(100vh - 96px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    transition: background var(--transition), border-color var(--transition);
  }

  .sidebar-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 16px;
  }

  .modulo { margin-bottom: 20px; }
  .modulo:last-child { margin-bottom: 0; }

  .modulo-head {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--ink2);
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  .modulo-num {
    font-size: 9px;
    font-weight: 700;
    background: var(--ink3);
    color: var(--bg);
    padding: 2px 6px;
    border-radius: 3px;
  }

  .aulas { list-style: none; }

  .aula-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 10px;
    font-size: 13px;
    color: var(--ink2);
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s, color .15s;
    margin-bottom: 1px;
  }

  .aula-item:hover { background: var(--surface2); color: var(--ink); }

  .aula-item.active {
    background: var(--ink);
    color: var(--bg);
    font-weight: 600;
  }

  .aula-item.active .aula-check { border-color: var(--bg); color: var(--bg); }

  .aula-check {
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--ink3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 9px;
    transition: background .15s, border-color .15s;
  }

  .aula-item.done .aula-check {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }

  .aula-item.done.active .aula-check {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }

  .aula-item.quiz .aula-check { border-style: dashed; }

  .aula-text { flex: 1; line-height: 1.35; }

  /* ── CONTENT ────────────────────────────────────────────── */
  .content {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 48px 52px;
    min-height: 60vh;
    transition: background var(--transition), border-color var(--transition);
  }

  .content-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 3px;
    color: var(--ink3);
    margin-bottom: 18px;
  }

  .content h1 {
    font-size: clamp(24px, 3.5vw, 32px);
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 14px;
  }

  .content .lead {
    font-size: 17px;
    color: var(--ink2);
    margin-bottom: 32px;
    line-height: 1.6;
  }

  .content h2 { font-size: 20px; font-weight: 700; margin: 36px 0 14px; }
  .content h3 { font-size: 16px; font-weight: 700; margin: 24px 0 10px; }
  .content p  { margin-bottom: 14px; }

  .content ul, .content ol { padding-left: 22px; margin-bottom: 14px; }
  .content li { margin-bottom: 6px; }

  .content strong { font-weight: 700; color: var(--ink); }
  .content em     { font-style: italic; }

  /* Callouts */
  .callout {
    background: var(--surface2);
    border-left: 3px solid var(--ink3);
    padding: 16px 20px;
    border-radius: 4px;
    margin: 20px 0;
    font-size: 15px;
    transition: background var(--transition);
  }

  .callout.warn { border-left-color: var(--red); background: var(--red-bg); }
  .callout.tip  { border-left-color: var(--green); background: var(--green-bg); }
  .callout.key  { border-left-color: var(--yellow); background: var(--key-bg); }

  .callout-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 6px;
  }

  .callout.warn .callout-title { color: var(--red); }
  .callout.tip  .callout-title { color: var(--green); }
  .callout.key  .callout-title { color: var(--yellow); }

  /* Indicator cards */
  .indicator-card {
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 18px 20px;
    margin: 12px 0;
    background: var(--surface2);
    transition: background var(--transition), border-color var(--transition);
  }

  .indicator-card h4 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .role-pill {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 10px;
    background: var(--ink3);
    color: var(--bg);
  }

  .role-pill.com  { background: #16a34a; color: #fff; }
  .role-pill.sem  { background: #d97706; color: #fff; }
  .role-pill.pres { background: #6366f1; color: #fff; }
  .role-pill.time { background: #2563eb; color: #fff; }

  /* Nav buttons */
  .nav-buttons {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }

  .nav-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
    color: var(--ink);
    transition: background .15s, border-color .15s;
  }

  .nav-btn:hover:not(:disabled) { border-color: var(--ink2); }
  .nav-btn:disabled { opacity: .3; cursor: not-allowed; }

  .nav-btn.primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .nav-btn.primary:hover:not(:disabled) { opacity: .85; }

  /* ── QUIZ ───────────────────────────────────────────────── */
  .quiz-question {
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 22px;
    margin-bottom: 16px;
    background: var(--surface2);
    transition: background var(--transition);
  }

  .quiz-q-num {
    font-size: 10px;
    font-weight: 700;
    color: var(--ink3);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .quiz-q-text {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    line-height: 1.45;
  }

  .quiz-options { list-style: none; display: flex; flex-direction: column; gap: 8px; }

  .quiz-opt {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--r);
    padding: 12px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    font-family: var(--sans);
    text-align: left;
    color: var(--ink);
    width: 100%;
  }

  .quiz-opt:hover:not(.disabled) { border-color: var(--ink2); background: var(--surface2); }
  .quiz-opt.selected { border-color: var(--ink2); background: var(--surface2); }

  .quiz-opt.correct {
    border-color: var(--green);
    background: var(--green-bg);
    color: #4ade80;
    font-weight: 600;
  }

  .quiz-opt.wrong {
    border-color: var(--red);
    background: var(--red-bg);
    color: #f87171;
  }

  .quiz-opt.disabled { cursor: default; }

  .quiz-explain {
    margin-top: 12px;
    font-size: 13px;
    color: var(--ink2);
    padding: 10px 14px;
    background: var(--surface);
    border-radius: 4px;
    border-left: 3px solid var(--ink3);
  }

  .quiz-result {
    text-align: center;
    padding: 32px 24px;
    border: 1px solid var(--border);
    border-radius: var(--r);
    background: var(--surface2);
    margin-bottom: 24px;
    transition: background var(--transition);
  }

  .quiz-score { font-size: 40px; font-weight: 700; margin-bottom: 6px; }

  .quiz-result-text { font-size: 14px; color: var(--ink2); margin-bottom: 18px; }

  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 16px;
  }

  .progress-fill {
    height: 100%;
    background: var(--green);
    transition: width .4s ease;
  }

  /* ── MOBILE ─────────────────────────────────────────────── */
  .sidebar-toggle {
    display: none;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
    margin-bottom: 12px;
    width: 100%;
    text-align: left;
  }

  @media (max-width: 900px) {
    .curso-layout {
      grid-template-columns: 1fr;
      padding: 16px 20px;
      gap: 12px;
    }
    .sidebar {
      position: static;
      max-height: none;
      display: none;
    }
    .sidebar.open { display: block; }
    .sidebar-toggle { display: block; }
    .content { padding: 28px 24px; }
    .curso-nav-inner { padding: 0 20px; }
    .curso-progress-mini { display: none; }
  }
</style>
</head>
<body>

<!-- ── LOGIN ──────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">DIDI INDEX ▸ SETUP</div>
    <div class="login-title">Área do Aluno</div>
    <div class="login-sub">Digite a senha de acesso enviada por e-mail.</div>
    <form id="form-login" novalidate>
      <div class="login-field">
        <label for="inp-senha">Senha de acesso</label>
        <input id="inp-senha" type="password" placeholder="••••••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="login-btn" id="btn-login">Entrar</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>
</div>

<!-- ── CURSO ───────────────────────────────────────────────── -->
<div id="curso-screen">
  <nav class="curso-nav">
    <div class="curso-nav-inner">
      <span class="curso-nav-logo">DIDI INDEX ▸ SETUP</span>
      <div class="curso-nav-right">
        <span class="curso-progress-mini" id="progress-mini">0% concluído</span>
        <button class="btn-theme" id="btn-theme" title="Alternar tema" aria-label="Alternar tema claro/escuro">
          <!-- sol: aparece no dark mode -->
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <!-- lua: aparece no light mode -->
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="curso-nav-logout" id="btn-logout">Sair</button>
      </div>
    </div>
  </nav>

  <div class="curso-layout">
    <button class="sidebar-toggle" id="sidebar-toggle">Menu de aulas</button>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-title">Curso completo</div>
      <div id="sidebar-modulos"></div>
    </aside>

    <main class="content" id="content"></main>
  </div>
</div>

<script src="/curso.js" defer></script>

<script>
  document.getElementById('btn-theme').addEventListener('click', function() {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('curso_tema', next);
  });
</script>

</body>
</html>
